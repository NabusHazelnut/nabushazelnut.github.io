*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
html,body{height:100vh;width:100vw;overflow:hidden;background:#000;color:#fff}
nav{position:fixed;top:0;left:0;width:100%;height:80px;padding:0 6%;display:flex;justify-content:space-between;align-items:center;background:#000;z-index:9999;border-bottom:1px solid #151515}
.logo{font-size:24px;font-weight:800;color:#c66a70}
.links{display:flex;gap:18px}
.links a{color:#666;text-decoration:none;font-size:11px;font-weight:600;padding-bottom:5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.links a.active{color:#fff;border-bottom:2px solid #c66a70}
.viewport{margin-top:80px;height:calc(100vh - 80px);width:100%;position:relative;overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;display:none !important;padding:30px 6%;overflow-y:auto;background:#000}
.page.active{display:flex !important;gap:30px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.circle{width:400px;height:400px;min-width:400px;border-radius:50%;background:#fff;overflow:hidden;border:1.5px solid #c66a70;box-shadow:0 0 60px rgba(198,106,112,.4);flex-shrink:0}
.circle img{width:100%;height:100%;object-fit:cover}
.title{font-size:26px;margin-bottom:12px;font-weight:800}
.title span{color:#c66a70}
.card{background:#111;border:1px solid #222;padding:14px;border-radius:12px}
.t-item{display:flex;gap:14px;background:#111;border:1px solid #222;padding:14px;border-radius:12px;margin-bottom:10px;border-left:3px solid #c66a70}
.t-item img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:4px;flex-shrink:0}
.skill-tag{background:#111;border:1px solid #c66a70;color:#c66a70;padding:4px 10px;border-radius:20px;font-size:10px;display:inline-block;margin:3px}
.skill-tag.soft{background:#1e1e1e;border-color:#333;color:#bbb}
.p-wrap{display:flex;gap:14px;flex-wrap:wrap}
.p-card{width:280px;background:#111;border:1px solid #222;border-radius:14px;padding:14px;text-align:center}
.p-card img{width:100%;height:170px;object-fit:cover;border-radius:10px;border:1px solid #c66a70;margin-bottom:8px;background:#222}
.btn{margin-top:14px;display:inline-flex;gap:8px;border:1.5px solid #c66a70;color:#c66a70;padding:9px 20px;border-radius:28px;font-size:11px;font-weight:600;cursor:pointer;background:transparent}
