<head>

<title>Hazel Nabus | Portfolio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;line-height:1.6}
h1,h2,h3,h4,.logo,.links a,.btn,.title{font-family:'Poppins',sans-serif}
html,body{width:100%;min-height:100vh;background:#000;color:#fff;overflow-x:hidden}
:root{--pink:#c97a7e;--card:#111;--border:#222}
nav{position:fixed;top:0;left:0;width:100%;height:clamp(60px, 8vh, 80px);padding:0 clamp(14px, 5vw, 6%);display:flex;justify-content:space-between;align-items:center;background:#000;z-index:9999;border-bottom:1px solid #151515}
.logo{font-size:clamp(19px, 2.4vw, 26px);font-weight:800;color:var(--pink)}
.links{display:flex;gap:clamp(14px, 2vw, 24px);overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{color:#777;text-decoration:none;font-size:clamp(11px, 1.1vw, 13px);font-weight:600;padding-bottom:5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.links a.active{color:#fff;border-bottom:2px solid var(--pink)}
.viewport{margin-top:clamp(60px, 8vh, 80px);min-height:calc(100vh - clamp(60px, 8vh, 80px));width:100%;position:relative}
.page{position:absolute;inset:0;width:100%;min-height:100%;display:none !important;padding:clamp(16px, 3vw, 32px) clamp(14px, 5vw, 6%);overflow-y:auto;background:#000}
.page.active{display:flex !important;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.about-left{flex:1;min-width:0}
.about-right{flex:0 0 340px;width:340px;max-width:340px}
.about-right img{width:100%;border-radius:14px;border:1px solid #c97a7e;display:block;object-fit:cover}
.circle{width:clamp(300px, 38vw, 560px);height:clamp(300px, 38vw, 560px);min-width:clamp(300px, 38vw, 560px);border-radius:50%;background:#fff;overflow:hidden;border:2px solid var(--pink);box-shadow:0 0 80px rgba(180,0,0,.35), 0 0 140px rgba(201,122,126,.35);flex-shrink:0;margin:auto 0}
.circle img{width:100%;height:100%;object-fit:cover;object-position:top}
.home-text{flex:1;max-width:640px}
.home-text h1{font-size:clamp(48px, 6.5vw, 84px);font-weight:800;line-height:1.05;letter-spacing:-2px;white-space:nowrap}
.home-text h1 span{color:var(--pink)}
.home-text h2{font-size:clamp(22px, 2.8vw, 36px);font-weight:700;margin:22px 0 18px}
.home-text p{color:#aaa;font-size:clamp(15px, 1.6vw, 21px);line-height:1.65;max-width:560px}
.home-text p b{color:#fff}
.home-btn{margin-top:30px;display:inline-flex;gap:10px;align-items:center;border:1.5px solid var(--pink);color:var(--pink);padding:clamp(12px, 1.2vw, 16px) clamp(28px, 3vw, 42px);border-radius:32px;font-size:clamp(14px, 1.4vw, 18px);font-weight:600;cursor:pointer;background:transparent}
.home-btn:hover{background:var(--pink);color:#000}
.title{font-size:clamp(22px, 2.8vw, 30px);margin-bottom:12px;font-weight:700}
.title span{color:var(--pink)}
.card{background:var(--card);border:1px solid var(--border);padding:clamp(14px, 2vw, 18px);border-radius:12px}
.card p{font-size:clamp(12.5px, 1.2vw, 14px);line-height:1.9}
.skill-tag{background:var(--card);border:1px solid var(--pink);color:var(--pink);padding:clamp(5px, .8vw, 6px) clamp(10px, 1.2vw, 14px);border-radius:20px;font-size:clamp(10px, 1.1vw, 11.5px);font-weight:500;display:inline-block;margin:3px}
.p-wrap{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:14px;width:100%}
.p-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.p-card img{width:100%;height:clamp(150px, 18vw, 175px);object-fit:cover;border-radius:10px;border:1px solid var(--pink);margin-bottom:8px;background:#222}
.p-card h3{font-size:clamp(13px, 1.4vw, 15px)}
.p-card p{font-size:clamp(11px, 1.1vw, 12.5px);line-height:1.6}
.btn{margin-top:18px;display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--pink);color:var(--pink);padding:clamp(10px, 1vw, 12px) clamp(20px, 2.5vw, 28px);border-radius:28px;font-size:clamp(12px, 1.2vw, 13.5px);font-weight:600;cursor:pointer;background:transparent}
.btn:hover{background:var(--pink);color:#000}
.ach-filter-wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;margin:6px 0 22px}
.ach-filter{background:#b8b8b8;color:#fff;border:none;padding:12px 18px;border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;cursor:pointer;min-width:160px;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ach-filter:hover{background:#d1d1d1}
.ach-filter.active{background:#fff;color:#000;font-weight:600}
.ach-filter .num{display:none;background:var(--pink);color:#000;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;padding:0 5px}
.ach-filter.active .num{display:inline-flex;animation:fade .2s ease}
.ach-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:18px;width:100%;max-width:1050px;margin:0 auto}
.ach-card{background:#fff;border-radius:4px;overflow:hidden;cursor:pointer;transition:.25s;position:relative;text-align:left}
.ach-card:hover{transform:translateY(-5px);box-shadow:0 18px 35px rgba(201,122,126,.35)}
.ach-card.hide{display:none}
.ach-card.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ach-thumb{width:100%;aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;padding:18px}
.ach-thumb img{width:100%;height:100%;object-fit:contain}
.ach-info{padding:14px 14px 16px;background:#000}
.ach-info h3{font-size:14px;font-weight:700;color:#fff;line-height:1.3}
.ach-info p{font-size:12px;color:#888;margin-top:4px}
.ach-view{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;color:#fff;font-weight:600;font-size:13px}
